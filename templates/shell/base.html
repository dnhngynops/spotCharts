<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Charts Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: {{ theme.background }};
            color: {{ theme.text_secondary }};
            font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Libre Franklin', 'Helvetica Neue', Arial, sans-serif;
            color: {{ theme.accent_light }};
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .dashboard-header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
            background: linear-gradient(180deg, #1C242B 0%, #121d26 20%, #07131D 100%);
            border-radius: 12px;
        }

        .dashboard-header h1 {
            font-size: 2.5em;
            font-weight: 600;
            color: {{ theme.text_secondary }};
            margin-bottom: 10px;
        }

        .dashboard-header h1 .spotify-green {
            color: {{ theme.primary }};
        }

        .dashboard-header .subtitle {
            font-size: 1.1em;
            color: {{ theme.text_artist }};
        }

        .dashboard-header .generated-at {
            font-size: 0.9em;
            color: {{ theme.text_artist }};
            margin-top: 10px;
        }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: {{ theme.surface }};
            border-radius: 8px;
            padding: 24px;
            text-align: center;
        }

        .summary-card .value {
            font-size: 2.5em;
            font-weight: 700;
            color: {{ theme.primary }};
        }

        .summary-card .label {
            font-size: 0.9em;
            color: {{ theme.text_artist }};
            margin-top: 5px;
        }

        /* Section styling */
        .section {
            background: {{ theme.surface }};
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            font-weight: 600;
            color: {{ theme.text_secondary }};
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid {{ theme.primary }};
        }

        /* Analytics Grid */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        /* Top Artists List */
        .artist-list {
            list-style: none;
        }

        .artist-item {
            display: flex;
            align-items: center;
            padding: 12px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: background 0.15s;
        }

        .artist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .artist-item:last-child {
            border-bottom: none;
        }

        .artist-rank {
            width: 30px;
            font-weight: 600;
            color: {{ theme.text_artist }};
        }

        .artist-name {
            flex: 1;
            color: {{ theme.text_track }};
        }

        .artist-name a {
            color: {{ theme.text_track }};
            text-decoration: none;
        }

        .artist-name a:hover {
            color: {{ theme.primary }};
        }

        .artist-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: {{ theme.text_artist }};
        }

        .stat-badge {
            background: rgba(108, 202, 152, 0.2);
            color: {{ theme.primary }};
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.85em;
        }

        /* Chart Overlap */
        .overlap-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .overlap-stat {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .overlap-stat .number {
            font-size: 2em;
            font-weight: 700;
            color: {{ theme.primary }};
        }

        .overlap-stat .label {
            font-size: 0.85em;
            color: {{ theme.text_artist }};
        }

        /* Overlap tracks list */
        .overlap-track {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .overlap-track img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            margin-right: 12px;
        }

        .overlap-track-info {
            flex: 1;
        }

        .overlap-track-name {
            color: {{ theme.text_track }};
        }

        .overlap-track-name a {
            color: {{ theme.text_track }};
            text-decoration: none;
        }

        .overlap-track-artist {
            font-size: 0.85em;
            color: {{ theme.text_artist }};
        }

        .overlap-charts {
            font-size: 0.8em;
            color: {{ theme.text_artist }};
        }

        .chart-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 5px;
            margin-top: 3px;
            color: {{ theme.text_artist }};
            text-decoration: none;
        }

        a.chart-tag:hover {
            background: rgba(29, 185, 84, 0.25);
            color: {{ theme.primary }};
        }

        /* Popularity Stats */
        .popularity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .popularity-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
        }

        .popularity-card .playlist-name {
            font-size: 0.9em;
            color: {{ theme.text_track }};
            margin-bottom: 8px;
        }

        .popularity-card .avg-value {
            font-size: 1.8em;
            font-weight: 700;
            color: {{ theme.primary }};
        }

        .popularity-card .range {
            font-size: 0.8em;
            color: {{ theme.text_artist }};
        }

        /* Explicit Stats */
        .explicit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .explicit-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
        }

        .explicit-card .playlist-name {
            font-size: 0.9em;
            color: {{ theme.text_track }};
            margin-bottom: 8px;
        }

        .explicit-bar-container {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .explicit-bar {
            height: 100%;
            background: #e74c3c;
            border-radius: 4px;
        }

        .explicit-card .percentage {
            font-size: 1.2em;
            font-weight: 600;
            color: {{ theme.text_secondary }};
        }

        /* Playlist Tables */
        .playlist-section {
            margin-bottom: 40px;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .playlist-title {
            font-size: 1.3em;
            color: {{ theme.text_secondary }};
        }

        .playlist-meta {
            font-size: 0.9em;
            color: {{ theme.text_artist }};
        }

        /* Data Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 12px 10px;
            color: {{ theme.text_artist }};
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .position-cell {
            width: 40px;
            text-align: center;
            font-weight: 600;
            color: {{ theme.text_artist }};
        }

        .track-cell-inner {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .album-thumb {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
        }

        .track-details {
            flex: 1;
        }

        .track-name {
            color: {{ theme.text_track }};
            font-weight: 500;
        }

        .track-name a {
            color: {{ theme.text_track }};
            text-decoration: none;
        }

        .track-name a:hover {
            color: {{ theme.primary }};
        }

        .artist-name {
            font-size: 0.85em;
            color: {{ theme.text_artist }};
        }

        .artist-name a {
            color: {{ theme.text_artist }};
            text-decoration: none;
        }

        /* Album link styling - match PDF report styling */
        .data-table td a {
            color: {{ theme.text_secondary }};
            text-decoration: none;
        }

        .data-table td a:hover {
            color: {{ theme.primary }};
        }

        .duration-cell {
            width: 60px;
            text-align: center;
            color: {{ theme.text_artist }};
        }

        .popularity-cell {
            width: 120px;
        }

        .pop-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pop-value {
            width: 25px;
            font-size: 0.85em;
            color: {{ theme.text_artist }};
            flex-shrink: 0;
        }

        .pop-bar-bg {
            display: block;
            flex: 1;
            height: 6px;
            background: {{ theme.bar_background }};
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .pop-bar {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: {{ theme.primary }};
            border-radius: 3px;
        }

        /* Trend / Historical Badges (populated by Supabase JS layer) */
        .trend-badge {
            display: inline-block;
            font-size: 0.65em;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 5px;
            font-weight: 700;
            vertical-align: middle;
            white-space: nowrap;
        }
        .trend-new  { background: #6CCA98; color: #000; }
        .trend-up   { background: #6CCA98; color: #000; }
        .trend-down { background: #e84393; color: #fff; }
        .trend-same { background: #444;    color: #aaa; }

        .run-selector {
            background: #1C242B;
            color: {{ theme.text_secondary }};
            border: 1px solid #313C45;
            border-radius: 4px;
            padding: 4px 8px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 0.85em;
        }

        /* Explicit Badge */
        .explicit-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: {{ theme.text_artist }};
            font-size: 0.7em;
            font-weight: 600;
            padding: 1px 4px;
            margin-right: 5px;
            border-radius: 2px;
            vertical-align: middle;
        }

        /* Footer */
        .dashboard-footer {
            text-align: center;
            padding: 30px;
            color: {{ theme.text_artist }};
            font-size: 0.9em;
        }

        /* Tabs */
        .tabs-container {
            margin-bottom: 40px;
        }

        .tab-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0;
        }

        .tab-button {
            background: transparent;
            border: none;
            color: {{ theme.text_artist }};
            padding: 12px 20px;
            font-size: 0.95em;
            font-family: inherit;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s ease;
            position: relative;
            bottom: -2px;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: {{ theme.text_secondary }};
        }

        .tab-button.active {
            background: rgba(108, 202, 152, 0.1);
            color: {{ theme.primary }};
            font-weight: 600;
            border-bottom: 2px solid {{ theme.primary }};
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tab-panel {
            padding-top: 20px;
        }

        /* Histogram */
        .histogram-wrapper {
            display: flex;
            align-items: stretch;
        }

        .histogram-y-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 0.75em;
            font-weight: 600;
            color: {{ theme.text_artist }};
            display: flex;
            align-items: center;
            justify-content: center;

            white-space: nowrap;
        }

        .histogram-x-label {
            text-align: center;
            font-size: 0.75em;
            font-weight: 600;
            color: {{ theme.text_artist }};
            margin-top: 8px;
        }

        .histogram {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 12px;
            flex: 1;
        }

        .histogram-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .histogram-count {
            font-size: 0.8em;
            color: {{ theme.text_artist }};
            margin-bottom: 4px;
        }

        .histogram-bar-wrap {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: flex-end;
        }

        .histogram-bar {
            width: 100%;
            background: {{ theme.primary }};
            border-radius: 3px 3px 0 0;
            min-height: 2px;
        }

        .histogram-label {
            font-size: 0.7em;
            color: {{ theme.text_artist }};
            margin-top: 4px;
        }

        /* Popularity range bar */
        .pop-range-bar {
            position: relative;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 12px 0 4px;
        }

        .pop-range-fill {
            position: absolute;
            top: 0;
            height: 100%;
            background: rgba(108, 202, 152, 0.3);
            border-radius: 4px;
        }

        .pop-range-avg {
            position: absolute;
            top: -3px;
            width: 14px;
            height: 14px;
            background: {{ theme.primary }};
            border-radius: 50%;
            transform: translateX(-50%);
        }

        /* Overlap stat dropdown fix */
        .overlap-stats {
            align-items: start;
        }

        .overlap-stat {
            position: relative;
            overflow: visible;
        }

        /* Modal-stat-style hover for clickable overlap-stat cards */
        .overlap-stat.dropdown-toggle {
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .overlap-stat.dropdown-toggle:hover {
            background: rgba(108, 202, 152, 0.12);
            transform: translateY(-1px);
        }

        /* Suppress the default inline dropdown-toggle chevron;
           replace with a positioned chevron at the bottom-right of the card */
        .overlap-stat.dropdown-toggle::after {
            content: '\25BE';
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 0.6em;
            color: {{ theme.text_artist }};
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .overlap-stat.dropdown-toggle:hover::after {
            opacity: 0.7;
        }

        .overlap-stat.dropdown-toggle.open::after {
            content: '\25B4';
            opacity: 0.7;
        }

        .overlap-stat .track-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 10;
            background: {{ theme.surface }};
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0 0 8px 8px;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .overlap-stat .track-dropdown li {
            padding: 6px 8px;
        }

        /* Track Dropdown */
        .dropdown-toggle {
            cursor: pointer;
            user-select: none;
        }

        .dropdown-toggle:hover {
            background: rgba(108, 202, 152, 0.35);
        }

        .dropdown-toggle::after {
            content: ' ▾';
            font-size: 0.75em;
        }

        .dropdown-toggle.open::after {
            content: ' ▴';
        }

        .track-dropdown {
            display: none;
            margin-top: 8px;
            padding: 0;
            list-style: none;
        }

        .track-dropdown.open {
            display: block;
        }

        .track-dropdown li {
            padding: 6px 0 6px 30px;
            font-size: 0.85em;
            color: {{ theme.text_artist }};
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-dropdown li:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .track-dropdown li:last-child {
            border-bottom: none;
        }

        .track-dropdown .dropdown-track-name {
            color: {{ theme.text_track }};
        }

        .track-dropdown .dropdown-track-name a {
            color: {{ theme.text_track }};
            text-decoration: none;
        }

        .track-dropdown .dropdown-track-name a:hover {
            color: {{ theme.primary }};
        }

        .track-dropdown .dropdown-track-meta {
            font-size: 0.9em;
            color: {{ theme.text_artist }};
        }

        /* Responsive */
        @media (max-width: 768px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }

            .overlap-stats {
                grid-template-columns: 1fr;
            }

            .dashboard-header h1 {
                font-size: 1.8em;
            }
        }

        /* ===== Filter Bar ===== */
        .filter-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-bar-inline {
            margin-top: 16px;
            margin-bottom: 20px;
        }

        .filter-bar-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 160px;
        }

        .filter-group-toggle {
            flex: 0 0 auto;
            min-width: auto;
        }

        .filter-group-reset {
            flex: 0 0 auto;
            min-width: auto;
            align-self: flex-end;
        }

        .filter-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: {{ theme.text_artist }};
            font-weight: 600;
        }

        .filter-input,
        .filter-select {
            background: {{ theme.background }};
            border: 1px solid {{ theme.border }};
            color: {{ theme.text_secondary }};
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: {{ theme.primary }};
        }

        .filter-input::placeholder {
            color: {{ theme.text_artist }};
        }

        .filter-select option {
            background: {{ theme.surface }};
            color: {{ theme.text_secondary }};
        }

        /* Explicit toggle buttons */
        .toggle-buttons {
            display: flex;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid {{ theme.border }};
        }

        .toggle-btn {
            background: {{ theme.background }};
            border: none;
            color: {{ theme.text_artist }};
            padding: 8px 14px;
            font-size: 0.85em;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            border-right: 1px solid {{ theme.border }};
        }

        .toggle-btn:last-child {
            border-right: none;
        }

        .toggle-btn.active {
            background: rgba(108, 202, 152, 0.2);
            color: {{ theme.primary }};
            font-weight: 600;
        }

        .toggle-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Reset button */
        .reset-btn {
            background: transparent;
            border: 1px solid {{ theme.border }};
            color: {{ theme.text_artist }};
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85em;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            border-color: {{ theme.primary }};
            color: {{ theme.primary }};
        }

        /* Results count */
        .filter-results {
            font-size: 0.85em;
            color: {{ theme.text_artist }};
            padding-top: 4px;
        }

        .filter-results #filter-count {
            color: {{ theme.primary }};
            font-weight: 600;
        }

        /* ===== Sortable Headers ===== */
        .data-table th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .data-table th.sortable:hover {
            color: {{ theme.primary }};
        }

        .data-table th.sortable.sort-active {
            color: {{ theme.primary }};
        }

        .sort-indicator {
            display: inline-block;
            margin-left: 4px;
            font-size: 0.75em;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .data-table th.sortable:hover .sort-indicator {
            opacity: 0.4;
        }

        .data-table th.sortable.sort-active .sort-indicator {
            opacity: 1;
        }

        /* No results message */
        .no-results-row td {
            text-align: center;
            padding: 40px 10px;
            color: {{ theme.text_artist }};
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .filter-bar-row {
                flex-direction: column;
            }
            .filter-group {
                min-width: 100%;
            }
        }

        /* ===== Profile Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: modalFadeIn 0.2s ease;
        }

        .modal-overlay.open {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {

            height: 38px;
            flex-shrink: 0;
            margin-right: 10px;

            height: 38px;
            border-radius: 4px;

            top: 0;

        /* Track modal: chart positions — mirrors album-modal-tracks conventions */
        .track-modal-positions .modal-section-title {

            padding: 0;

            margin: 0 -8px;

        .track-modal-positions .modal-track-item > .modal-track-info {
            flex: 1;
            min-width: 0;
        }
        /* Track modal sticky footer */
        .track-modal-footer {
            position: sticky;
            bottom: -24px;
            background: {{ theme.surface }};
            margin: 16px -24px -24px -24px;
            padding: 12px 24px 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .track-modal-footer-content {
            color: {{ theme.text_artist }};
            font-size: 0.9em;
        }

        /* Song modal: album tracklist dropdown */
        .track-album-dropdown {
            cursor: default;
        }
        .track-album-dropdown[onclick] {
            cursor: pointer;
        }
        .track-album-header {
            display: flex;
            align-items: center;
            gap: 6px;
            color: {{ theme.text_secondary }};
            font-size: 0.95em;
        }
        .track-album-chevron {
            font-size: 1em;
            color: {{ theme.text_artist }};
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }
        .track-album-dropdown.open .track-album-chevron {
            transform: rotate(-180deg);
        }
        .track-album-tracklist {
            list-style: none;
            margin: 8px 0 0 0;
            padding: 0;
            display: none;
        }
        .track-album-dropdown.open .track-album-tracklist {
            display: block;
        }
        .track-album-track-item {

            align-items: baseline;
            gap: 8px;
            padding: 3px 6px;
            margin: 0 -6px;
            border-radius: 3px;
            font-size: 0.8em;
            color: {{ theme.text_artist }};
            border-bottom: none;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .track-album-track-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: {{ theme.text_secondary }};
        }
        .track-album-track-item:hover .track-album-track-name a {
            color: {{ theme.text_secondary }};
        }
        .track-album-track-item.is-charting {
            color: {{ theme.text_secondary }};
        }
        .track-album-track-item.is-charting:hover {
            background: rgba(108, 202, 152, 0.08);
        }
        .track-album-track-num {
            flex-shrink: 0;
            width: 18px;
            text-align: right;
            font-size: 0.9em;
            opacity: 0.6;
        }
        .track-album-track-name {
            flex: 1;
            min-width: 0;
        }
        .track-album-track-dur {
            flex-shrink: 0;
            font-size: 0.9em;
            opacity: 0.5;
        }
        .track-album-track-badges {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .track-album-track-badges .modal-chart-badge {
            font-size: 0.8em;
        }

        /* Chart positions badge cloud */
        .track-chart-badge-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* Inline popularity bar inside stat cell */
        .modal-stat-pop-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            overflow: hidden;
            margin: 5px 0 3px;
        }
        .modal-stat-pop-fill {
            height: 100%;
            background: {{ theme.primary }};
            border-radius: 2px;
        }

        .modal-popularity-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .modal-popularity-value {
            font-size: 1.2em;
            font-weight: 600;
            color: {{ theme.primary }};
            width: 35px;
        }

        .modal-popularity-track {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .modal-popularity-fill {
            height: 100%;
            background: {{ theme.primary }};
            border-radius: 4px;
        }

        .modal-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: {{ theme.primary }};
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 16px;
            transition: all 0.2s ease;
        }

        .modal-link-btn:hover {
            transform: scale(1.05);
        }

        /* Profile link styling */
        .profile-link {
            cursor: pointer;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 768px) {
            .modal-content {
                max-width: 95%;
                max-height: 90vh;
            }
            .modal-header {
                padding: 16px;
            }
            .modal-image, .modal-image-placeholder {
                width: 60px;
                height: 60px;
            }
            .modal-title {
                font-size: 1.2em;
            }
            .modal-body {
                padding: 16px;
                max-height: calc(90vh - 110px);
            }
        }

        /* ── App Shell / Sidebar ──────────────────────────────── */
        .sidebar {
            width: 220px;
            min-width: 220px;
            background: #07131D;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease, min-width 0.25s ease;
            overflow: hidden;
            flex-shrink: 0;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: 60px;
            min-width: 60px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            padding: 0 12px;
            height: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .sidebar-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.15s, background 0.15s;
        }

        .sidebar-toggle:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.15s, width 0.15s;
            margin-left: 10px;
        }

        .sidebar-logo img {
            height: 28px;
            width: auto;
            display: block;
            filter: none;
        }

        .sidebar.collapsed .sidebar-logo {
            opacity: 0;
            width: 0;
            margin-left: 0;
        }

        .sidebar-nav {
            flex: 1;
            padding: 8px 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .nav-section-label {
            font-size: 0.68em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.25);
            padding: 14px 18px 4px;
            white-space: nowrap;
            transition: opacity 0.15s;
        }

        .sidebar.collapsed .nav-section-label {
            opacity: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
            position: relative;
            gap: 12px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: inherit;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.9);
        }

        .nav-item.active {
            color: #6CCA98;
            background: rgba(108, 202, 152, 0.1);
        }

        .nav-item .nav-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item .nav-label {
            font-size: 0.88em;
            font-weight: 500;
            overflow: hidden;
            transition: opacity 0.15s;
        }

        .sidebar.collapsed .nav-label {
            opacity: 0;
            width: 0;
        }

        /* Tooltip shown when sidebar is collapsed */
        .nav-item[data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 58px;
            background: #1C242B;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8em;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .sidebar.collapsed .nav-item[data-tooltip]:hover::after {
            opacity: 1;
        }

        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 0;
            flex-shrink: 0;
        }

        /* Main content area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            min-width: 0;
        }

        /* View system */
        .app-view {
            display: none;
        }

        .app-view.active {
            display: block;
        }

        /* Placeholder views for future tools */
        .view-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            gap: 16px;
        }

        .view-placeholder svg {
            opacity: 0.25;
        }

        .view-placeholder h2 {
            font-size: 1.6em;
            color: rgba(255, 255, 255, 0.45);
            font-weight: 600;
        }

        .view-placeholder p {
            font-size: 0.9em;
            max-width: 320px;
            line-height: 1.6;
        }

        .coming-soon-badge {
            display: inline-block;
            background: rgba(108, 202, 152, 0.12);
            color: #6CCA98;
            border: 1px solid rgba(108, 202, 152, 0.3);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ── Deal Projector (Revenue Calculator) ─────────────── */
        .rc-wrapper { max-width: 1400px; margin: 0 auto; }

        .rc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

        .rc-mode-btn {

        .rc-input {

        }
        .rc-results-streams-value { font-size: 1.6em; font-weight: 700; color: #fff; font-family: monospace; }

        .rc-metrics-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .rc-metric {
            padding: 20px; border-right: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .rc-metric:nth-child(even) { border-right: none; }
        .rc-metric:nth-last-child(-n+2) { border-bottom: none; }
        .rc-metric-highlight { background: rgba(108, 202, 152, 0.06); }
        .rc-metric-label {
            font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.05em;
            color: rgba(255,255,255,0.4); font-weight: 600; margin-bottom: 6px;
        }
        .rc-metric-value { font-size: 1.5em; font-weight: 700; color: #fff; }
        .rc-metric-green { color: #6CCA98; }
        .rc-metric-primary { color: #6CCA98; font-size: 1.8em; }
        .rc-metric-sub { font-size: 0.72em; color: rgba(255,255,255,0.3); margin-top: 4px; }

        .rc-breakdown { padding: 20px 24px; background: rgba(0,0,0,0.15); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .rc-breakdown-title {
            font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.08em;
            color: rgba(255,255,255,0.4); font-weight: 700; margin: 0 0 12px;
        }
        .rc-breakdown-row {
            display: flex; justify-content: space-between;
            font-size: 0.88em; color: rgba(255,255,255,0.55); padding: 5px 0;
        }
        .rc-breakdown-total {
            border-top: 1px solid rgba(255,255,255,0.1); margin-top: 4px;
            padding-top: 10px; font-weight: 700; color: #fff;
        }
        .rc-breakdown-total span:last-child { color: #6CCA98; }
        .rc-results-actions { padding: 16px 24px; display: flex; justify-content: flex-end; gap: 10px; }
        .rc-btn-secondary {
            background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
            padding: 8px 16px; color: rgba(255,255,255,0.6); font-size: 0.85em;
            font-family: inherit; cursor: pointer; transition: all 0.15s;
        }
        .rc-btn-secondary:hover { border-color: #6CCA98; color: #6CCA98; }

        .rc-settings-panel { max-width: 800px; margin: 0 auto; }
        .rc-settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 600px) { .rc-settings-grid { grid-template-columns: 1fr; } }
        .rc-recoupment-section { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px; }
        .rc-recoup-options { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
        .rc-recoup-option {
            display: flex; align-items: flex-start; gap: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 14px 16px; cursor: pointer; flex: 1;
            transition: border-color 0.15s, background 0.15s;
        }
        .rc-recoup-option.rc-recoup-selected { border-color: #6CCA98; background: rgba(108, 202, 152, 0.08); }
        .rc-recoup-option input[type="radio"] { accent-color: #6CCA98; width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
        .rc-recoup-title { display: block; font-size: 0.88em; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .rc-recoup-desc { display: block; font-size: 0.75em; color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <!-- ── App Sidebar ──────────────────────────────────────────── -->
    <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-header">
            <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                    <rect y="2" width="18" height="2" rx="1"/>
                    <rect y="8" width="18" height="2" rx="1"/>
                    <rect y="14" width="18" height="2" rx="1"/>
                </svg>
            </button>
            <span class="sidebar-logo">
                <img src="https://www.milkhoneyla.com/wp-content/uploads/2024/05/MH-Logo.png"
                     alt="Milk &amp; Honey" />
            </span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Analytics</div>
            <button class="nav-item active" data-view="charts" data-tooltip="Charts" onclick="switchView('charts')">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                        <rect x="1" y="8" width="4" height="9" rx="1"/>
                        <rect x="7" y="4" width="4" height="13" rx="1"/>
                        <rect x="13" y="1" width="4" height="16" rx="1"/>
                    </svg>
                </span>
                <span class="nav-label">Charts Dashboard</span>
            </button>

            <div class="nav-section-label">Tools</div>
            <button class="nav-item" data-view="revenue" data-tooltip="Deal Projector" onclick="switchView('revenue')">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="9" cy="9" r="7.5"/>
                        <text x="9" y="13.5" text-anchor="middle" font-size="9" fill="currentColor" stroke="none" font-family="Helvetica Neue, Arial, sans-serif">$</text>
                    </svg>
                </span>
                <span class="nav-label">Deal Projector</span>
            </button>

            <div class="nav-section-label">Management</div>
            <button class="nav-item" data-view="rosters" data-tooltip="Rosters" onclick="switchView('rosters')">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                        <circle cx="6" cy="5" r="3"/>
                        <circle cx="12" cy="5" r="3"/>
                        <path d="M0 16c0-3.3 2.7-6 6-6s6 2.7 6 6H0z"/>
                        <path d="M12 10c1.5 0 6 .8 6 3v3h-6v-3c0-1-.4-1.9-1-2.6A5.9 5.9 0 0 1 12 10z"/>
                    </svg>
                </span>
                <span class="nav-label">Rosters</span>
            </button>
        </nav>
        <div class="sidebar-footer">
            <button class="nav-item" data-view="account" data-tooltip="Account" onclick="switchView('account')">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                        <circle cx="9" cy="6" r="4"/>
                        <path d="M1 17c0-4.4 3.6-8 8-8s8 3.6 8 8H1z"/>
                    </svg>
                </span>
                <span class="nav-label">Account</span>
            </button>
        </div>
    </aside>

    <!-- ── Main Content ─────────────────────────────────────────── -->
    <div class="main-content">

        {% include 'charts/dashboard.html' %}

        {% include 'deal_projector/projector.html' %}

        {% include 'rosters/placeholder.html' %}

        {% include 'account/placeholder.html' %}

    </div><!-- /div.main-content -->

    {% include 'components/profile_modal.html' %}

    <!-- ── Sidebar & View Navigation ───────────────────────────── -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('app-sidebar');
            sidebar.classList.toggle('collapsed');
            try {
                localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
            } catch(e) {}
        }

        function switchView(viewName) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            document.querySelectorAll('.nav-item[data-view]').forEach(item => {
                item.classList.toggle('active', item.dataset.view === viewName);
            });
        }

        // Restore sidebar collapsed state from localStorage
        (function() {
            try {
                if (localStorage.getItem('sidebarCollapsed') === 'true') {
                    document.getElementById('app-sidebar').classList.add('collapsed');
                }
            } catch(e) {}
        })();
    </script>
</body>
</html>
